<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>民泊クイズ｜あなたは民泊制度マスター？</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --main-pink: #f4a3b3;
    --main-gold: #e0a84e;
    --bg: #fdf6ec;
    --text: #4a3728;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(180deg, #fff8ee, #fdeee0);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 12px 60px;
  }
  .app {
    width: 100%;
    max-width: 720px;
  }
  .header-img {
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto 8px;
    border-radius: 16px;
  }
  .subtitle {
    text-align: center;
    color: #8a7362;
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    padding: 28px 24px;
    margin-bottom: 20px;
  }
  label.field-label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 2px solid #eadfce;
    border-radius: 12px;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--main-gold); }
  .hint {
    font-size: 0.85rem;
    color: #a08d7c;
    margin-top: 6px;
  }
  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 999px;
    font-size: 1.05rem;
    font-weight: bold;
    padding: 14px 20px;
    width: 100%;
    transition: transform 0.1s ease, opacity 0.2s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, #f7b8c4, #f2909f);
    color: #fff;
  }
  .btn-secondary {
    background: #fff;
    border: 2px solid var(--main-gold);
    color: var(--main-gold);
    margin-top: 10px;
  }
  .btn-download {
    background: linear-gradient(135deg, #7fc9a8, #5bb98c);
    color: #fff;
    margin-top: 14px;
  }
  .btn-share {
    background: #111;
    color: #fff;
    margin-top: 10px;
  }
  .share-note {
    background: #fff8e6;
    border: 1px solid #f0dca0;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.82rem;
    line-height: 1.6;
    color: #7a5c1e;
    margin: 12px 0 0;
  }
  .question {
    margin-bottom: 26px;
    padding-bottom: 22px;
    border-bottom: 1px dashed #eee0cd;
  }
  .question:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .q-num {
    display: inline-block;
    background: var(--main-gold);
    color: #fff;
    font-size: 0.8rem;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .q-text {
    font-weight: bold;
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .choices { display: flex; flex-direction: column; gap: 8px; }
  .choice {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 2px solid #eee0cd;
    border-radius: 12px;
    cursor: pointer;
  }
  .choice:hover { border-color: #f2c9d1; }
  .choice.selected {
    border-color: var(--main-pink);
    background: #fff2f5;
  }
  .choice input { accent-color: var(--main-pink); width: 18px; height: 18px; flex-shrink: 0; }
  .choice span { line-height: 1.4; }
  .progress-bar-wrap {
    background: #f1e6d5;
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #f7b8c4, var(--main-gold));
    width: 0%;
    transition: width 0.2s ease;
  }
  .warn {
    color: #c0466a;
    font-size: 0.9rem;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
  .result-score {
    text-align: center;
    font-size: 1.1rem;
    margin-bottom: 16px;
  }
  .result-score .big {
    font-size: 2.4rem;
    font-weight: bold;
    color: var(--main-pink);
  }
  canvas#certCanvas {
    width: 100%;
    height: auto;
    border-radius: 14px;
    display: block;
    margin: 0 auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  .screen { display: none; }
  .screen.active { display: block; }
  footer {
    text-align: center;
    color: #b3a08e;
    font-size: 0.8rem;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="app">
  <img class="header-img" id="headerImg" alt="目指せ民泊制度博士 あなたは何点取れる？">
  <p class="subtitle">全10問。あなたの民泊知識レベルに応じて、名前入りの認定証イラストをプレゼント！</p>

  <!-- スタート画面 -->
  <div id="screen-start" class="screen active">
    <div class="card">
      <label class="field-label" for="userName">認定証に表示するお名前・ニックネーム</label>
      <input type="text" id="userName" maxlength="8" placeholder="例）たろう">
      <p class="hint">あとで結果画面に表示されます（未入力の場合は「あなた」と表示されます／最大8文字）</p>
    </div>
    <button class="btn-primary" id="btnStart">クイズをはじめる</button>
  </div>

  <!-- クイズ画面 -->
  <div id="screen-quiz" class="screen">
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progressFill"></div></div>
    <div class="card" id="questionsContainer"></div>
    <p class="warn" id="warnMsg">すべての質問に回答してください。</p>
    <button class="btn-primary" id="btnSubmit">採点する</button>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen">
    <div class="card">
      <div class="result-score">
        <span id="userNameDisplay"></span>さんの結果：<span class="big" id="scoreText">0</span> / 10点
      </div>
      <canvas id="certCanvas"></canvas>
      <button class="btn-download" id="btnDownload">① 認定証イラストをダウンロード</button>
      <button class="btn-share" id="btnShare">② Xでシェアする</button>
      <p class="share-note">
        ※Xの投稿画面には、文章とリンクは自動で入りますが、<strong>認定証イラスト（画像）は自動では貼り付けられません。</strong><br>
        先に「①ダウンロード」で画像を保存してから「②Xでシェアする」を押し、開いた投稿画面に保存した画像をご自身で添付（貼り付け）してください。
      </p>
      <button class="btn-secondary" id="btnRetry">もう一度挑戦する</button>
    </div>
  </div>

  <footer>#民泊クイズ ｜ 民泊制度について、みんなで正しく知ろう</footer>
</div>

<script src="assets/images.js"></script>
<script>
// ---- クイズデータ（民泊クイズ.txtの内容に対応） ----
const QUIZ = [
  {
    q: "住宅宿泊事業（民泊新法）。基本は年間最大何日まで営業できる？",
    choices: ["90日", "120日", "180日", "365日"],
    answer: 2
  },
  {
    q: "特区民泊の年間営業日数は？",
    choices: ["90日まで", "180日まで", "240日まで", "上限なし"],
    answer: 3
  },
  {
    q: "旅館業の年間営業日数は？",
    choices: ["90日まで", "180日まで", "240日まで", "上限なし"],
    answer: 3
  },
  {
    q: "「民泊」と呼ばれるものの法律上の制度は1種類だけ？",
    choices: ["1種類だけ", "複数ある", "すべて旅館業", "すべて住宅宿泊業（民泊新法）"],
    answer: 1
  },
  {
    q: "住宅宿泊事業の営業ルールは全国同じ？",
    choices: ["全国同じ", "自治体で違う", "東京だけ違う", "人口で決まる"],
    answer: 1
  },
  {
    q: "東京23区の住宅宿泊事業。区によって違うことがあるのは？",
    choices: ["営業できる曜日・区域", "年間180日を超える上限", "届出が必要なこと", "根拠となる法律"],
    answer: 0
  },
  {
    q: "住居専用地域で営業できる可能性があるのは？",
    choices: ["住宅宿泊事業", "旅館業だけ", "どちらも不可", "全国一律で不可"],
    answer: 0
  },
  {
    q: "特区民泊は、どこでも認定を受けられる？",
    choices: ["受けられる", "特区民泊の実施地域に限られる", "住宅地なら可", "観光地なら可"],
    answer: 1
  },
  {
    q: "特区民泊には、営業日数の上限はありません。では最低宿泊日数のルールはある？",
    choices: ["ある", "ない", "180日以上", "1か月以上"],
    answer: 0
  },
  {
    q: "無届出・無許可で民泊営業を行った場合、どうなる可能性がある？",
    choices: ["特に罰則はなく注意で済む", "罰金などの罰則の対象になり得る", "逆に届出が免除される", "自動的に旅館業許可に切り替わる"],
    answer: 1
  }
];

// ---- 点数帯ごとの設定 ----
// nameCenterY はイラストごとに名前欄の縦位置が微妙に異なるため個別に調整（画像の高さに対する比率）
const RESULT_LEVELS = [
  { min: 0, max: 4, img: () => IMG_0_4, title: "民泊制度ビギナー", nameCenterY: 0.591 },
  { min: 5, max: 7, img: () => IMG_5_7, title: "民泊制度勉強家", nameCenterY: 0.577 },
  { min: 8, max: 9, img: () => IMG_8_9, title: "民泊制度上級者", nameCenterY: 0.612 },
  { min: 10, max: 10, img: () => IMG_10, title: "民泊制度博士", nameCenterY: 0.611 }
];

function getLevel(score) {
  return RESULT_LEVELS.find(l => score >= l.min && score <= l.max);
}

// ---- ヘッダー画像を設定 ----
document.getElementById("headerImg").src = IMG_HEADER;

// ---- 状態 ----
const answers = new Array(QUIZ.length).fill(null);
let userName = "";

// ---- 画面切り替え ----
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ---- クイズ画面の描画 ----
function renderQuestions() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";
  QUIZ.forEach((item, qi) => {
    const qDiv = document.createElement("div");
    qDiv.className = "question";
    const num = document.createElement("div");
    num.className = "q-num";
    num.textContent = `Q${qi + 1} / ${QUIZ.length}`;
    const qText = document.createElement("div");
    qText.className = "q-text";
    qText.textContent = item.q;
    const choicesDiv = document.createElement("div");
    choicesDiv.className = "choices";

    item.choices.forEach((choiceText, ci) => {
      const label = document.createElement("label");
      label.className = "choice";
      label.dataset.qi = qi;
      label.dataset.ci = ci;
      const input = document.createElement("input");
      input.type = "radio";
      input.name = `q${qi}`;
      input.value = ci;
      input.addEventListener("change", () => {
        answers[qi] = ci;
        choicesDiv.querySelectorAll(".choice").forEach(c => c.classList.remove("selected"));
        label.classList.add("selected");
        updateProgress();
      });
      const span = document.createElement("span");
      const circledNumbers = ["①", "②", "③", "④"];
      span.textContent = `${circledNumbers[ci]} ${choiceText}`;
      label.appendChild(input);
      label.appendChild(span);
      choicesDiv.appendChild(label);
    });

    qDiv.appendChild(num);
    qDiv.appendChild(qText);
    qDiv.appendChild(choicesDiv);
    container.appendChild(qDiv);
  });
}

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  const pct = Math.round((answered / QUIZ.length) * 100);
  document.getElementById("progressFill").style.width = pct + "%";
}

// ---- 採点 ----
function scoreQuiz() {
  let score = 0;
  QUIZ.forEach((item, qi) => {
    if (answers[qi] === item.answer) score++;
  });
  return score;
}

// ---- Canvasに認定証を描画 ----
const NAME_FONT_FAMILY = '"M PLUS Rounded 1c", sans-serif';

async function drawCertificate(score, name, callback) {
  const level = getLevel(score);

  // 可愛いフォントの読み込みを待ってから描画する（未読込だと既定フォントで幅がズレるため）
  try {
    await Promise.all([
      document.fonts.load(`700 72px ${NAME_FONT_FAMILY}`),
      document.fonts.load(`500 40px ${NAME_FONT_FAMILY}`)
    ]);
  } catch (e) { /* フォント取得に失敗しても既定フォントで続行 */ }

  const img = new Image();
  img.onload = function () {
    const canvas = document.getElementById("certCanvas");
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);

    // 名前を入れる欄（イラストにあらかじめ用意された、肉球アイコン付きの枠）全体の中央に配置する
    const areaX = img.width * 0.482;
    const areaRight = img.width * 0.963;
    const areaCenterY = img.height * level.nameCenterY;
    const areaW = areaRight - areaX;

    const displayName = (name && name.trim()) ? name.trim() : "あなた";
    const suffix = " 殿";
    const fontFamily = NAME_FONT_FAMILY;

    let nameFontSize = 72;
    let suffixFontSize = Math.round(nameFontSize * 0.55);

    function measureTotal() {
      ctx.font = `700 ${nameFontSize}px ${fontFamily}`;
      const nameW = ctx.measureText(displayName).width;
      ctx.font = `500 ${suffixFontSize}px ${fontFamily}`;
      const suffixW = ctx.measureText(suffix).width;
      return nameW + suffixW;
    }

    suffixFontSize = Math.round(nameFontSize * 0.55);
    while (measureTotal() > areaW - 40 && nameFontSize > 24) {
      nameFontSize -= 2;
      suffixFontSize = Math.round(nameFontSize * 0.55);
    }

    const totalW = measureTotal();
    let drawX = areaX + (areaW - totalW) / 2;
    // 文字の下端（ベースライン）をnameとsuffixで揃えるため、共通のベースラインYを使う
    const baselineY = areaCenterY + nameFontSize * 0.36;

    ctx.fillStyle = "#8a7768"; // 濃すぎない、やわらかい色合いに
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";

    ctx.font = `700 ${nameFontSize}px ${fontFamily}`;
    ctx.fillText(displayName, drawX, baselineY);
    drawX += ctx.measureText(displayName).width;

    ctx.font = `500 ${suffixFontSize}px ${fontFamily}`;
    ctx.fillText(suffix, drawX, baselineY);

    callback(canvas);
  };
  img.src = level.img();
}

// ---- イベント ----
document.getElementById("btnStart").addEventListener("click", () => {
  userName = document.getElementById("userName").value;
  renderQuestions();
  updateProgress();
  showScreen("screen-quiz");
});

document.getElementById("btnSubmit").addEventListener("click", () => {
  if (answers.includes(null)) {
    document.getElementById("warnMsg").style.display = "block";
    const firstUnanswered = answers.findIndex(a => a === null);
    const qDivs = document.querySelectorAll(".question");
    qDivs[firstUnanswered].scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  document.getElementById("warnMsg").style.display = "none";

  const score = scoreQuiz();
  const level = getLevel(score);
  document.getElementById("scoreText").textContent = score;
  document.getElementById("userNameDisplay").textContent = (userName && userName.trim()) ? userName.trim() : "あなた";

  drawCertificate(score, userName, () => {
    showScreen("screen-result");

    document.getElementById("btnShare").onclick = () => {
      const text = `民泊クイズで10点満点中${score}点（${level.title}）でした！ #民泊クイズ`;
      const url = location.href.split("#")[0];
      const shareUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
      window.open(shareUrl, "_blank");
    };
  });
});

document.getElementById("btnDownload").addEventListener("click", () => {
  const canvas = document.getElementById("certCanvas");
  const link = document.createElement("a");
  link.download = "民泊クイズ認定証.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

document.getElementById("btnRetry").addEventListener("click", () => {
  answers.fill(null);
  document.getElementById("userName").value = "";
  showScreen("screen-start");
});
</script>
</body>
</html>
